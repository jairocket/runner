[versions]
kotlin = "2.1.21"
ktor = "3.1.3"
koin = "4.0.4"
exposed = "0.61.0"
hikari = "6.3.0"
postgres = "42.7.5"
dotenv = "6.5.1"
logback = "1.5.18"
junit = "5.11.4"
flyway        = "11.8.2"
testcontainers = "1.21.1"

[libraries]
ktor-server-core        = { module = "io.ktor:ktor-server-core",                 version.ref = "ktor" }
ktor-server-netty       = { module = "io.ktor:ktor-server-netty",                version.ref = "ktor" }
ktor-server-content-neg = { module = "io.ktor:ktor-server-content-negotiation",  version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json",  version.ref = "ktor" }
ktor-server-test-host   = { module = "io.ktor:ktor-server-test-host",            version.ref = "ktor" }
koin-ktor               = { module = "io.insert-koin:koin-ktor",                 version.ref = "koin" }
koin-logger             = { module = "io.insert-koin:koin-logger-slf4j",         version.ref = "koin" }
exposed-core            = { module = "org.jetbrains.exposed:exposed-core",       version.ref = "exposed" }
exposed-jdbc            = { module = "org.jetbrains.exposed:exposed-jdbc",       version.ref = "exposed" }
hikari                  = { module = "com.zaxxer:HikariCP",                      version.ref = "hikari" }
postgres-driver         = { module = "org.postgresql:postgresql",                version.ref = "postgres" }
dotenv                  = { module = "io.github.cdimascio:dotenv-kotlin",        version.ref = "dotenv" }
logback                 = { module = "ch.qos.logback:logback-classic",           version.ref = "logback" }
junit-jupiter-engine    = { module = "org.junit.jupiter:junit-jupiter-engine",   version.ref = "junit" }
exposed-java-time             = { module = "org.jetbrains.exposed:exposed-java-time",                  version.ref = "exposed" }
flyway-core                   = { module = "org.flywaydb:flyway-core",                                  version.ref = "flyway" }
flyway-database-postgresql    = { module = "org.flywaydb:flyway-database-postgresql",                   version.ref = "flyway" }
testcontainers-bom            = { module = "org.testcontainers:testcontainers-bom",                     version.ref = "testcontainers" }
testcontainers-junit-jupiter  = { module = "org.testcontainers:junit-jupiter",                          version.ref = "testcontainers" }
testcontainers-postgresql     = { module = "org.testcontainers:postgresql",                             version.ref = "testcontainers" }

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
ktor                 = { id = "io.ktor.plugin",                                  version.ref = "ktor" }
